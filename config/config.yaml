# Remoir configuration. Environment variables with the REMOIR_ prefix override
# selected values (see app/core/config.py and .env.example).

app:
  name: Remoir
  data_dir: data
  log_level: INFO

ingestion:
  max_upload_mb: 50
  # Pages with fewer extractable characters than this are flagged as low-text.
  min_page_chars: 40
  # If at least this fraction of pages are low-text the document is treated as scanned.
  scanned_page_ratio: 0.8

ocr:
  # OCR needs a local Tesseract installation (PyMuPDF calls it). Off by default.
  enabled: false
  language: eng
  dpi: 300

chunking:
  # Sizes are measured in tokens of the embedding model's tokenizer when it is
  # available, otherwise approximated as words * 1.3.
  chunk_size: 220
  chunk_overlap: 40
  min_chunk_tokens: 25
  max_chunk_tokens: 400

embedding:
  # "sentence-transformers" (default) or "hashing" (deterministic, test-only).
  backend: sentence-transformers
  model_name: BAAI/bge-small-en-v1.5
  # BGE models recommend this prefix on queries (not on passages).
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 32
  max_seq_length: 512

retrieval:
  top_k: 6
  # "dense", "hybrid" (dense + BM25 with reciprocal rank fusion)
  strategy: hybrid
  candidate_multiplier: 4
  rrf_k: 60
  # Cross-encoder reranking (downloads cross-encoder/ms-marco-MiniLM-L-6-v2, ~90 MB).
  rerank: false
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  # Near-duplicate passage suppression (Jaccard similarity on word shingles).
  dedup_threshold: 0.85
  max_context_tokens: 2500

evidence:
  # A question is answered only if retrieval clears both checks.
  min_dense_score: 0.45
  min_term_coverage: 0.3
  # Claim-to-evidence support threshold used in citation verification.
  min_support_score: 0.5

llm:
  # "extractive" (offline, no model needed), "ollama", or "openai" (any
  # OpenAI-compatible chat completions endpoint).
  provider: extractive
  model: llama3.2:3b
  ollama_url: http://localhost:11434
  openai_base_url: https://api.openai.com/v1
  temperature: 0.1
  max_tokens: 700
  timeout_s: 120
  # Extractive provider: minimum sentence relevance, and the fraction of the best
  # sentence's score a sentence needs to be quoted (chosen by the evaluation sweep).
  extractive_min_score: 0.35
  extractive_relative_floor: 0.8

conversation:
  max_turns: 6
  max_history_chars: 2000
